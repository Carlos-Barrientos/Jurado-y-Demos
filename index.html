<!DOCTYPE html>
<html lang="es" class="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PROSUR AI Demo Showcase - Innovation Hub</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet"/>
  
  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  
  <!-- Tailwind CSS Runtime -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#9e001f",
            "primary-container": "#c8102e",
            "on-primary": "#ffffff",
            "on-primary-container": "#ffdad8",
            "secondary": "#5b5f61",
            "secondary-container": "#e0e3e5",
            "on-secondary": "#ffffff",
            "on-secondary-container": "#616567",
            "tertiary": "#4d4c4c",
            "tertiary-container": "#656464",
            "surface": "#f8f9fa",
            "surface-bright": "#f8f9fa",
            "surface-dim": "#d9dadb",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f3f4f5",
            "surface-container": "#edeeef",
            "surface-container-high": "#e7e8e9",
            "surface-container-highest": "#e1e3e4",
            "on-surface": "#191c1d",
            "on-surface-variant": "#5c403f",
            "background": "#f8f9fa",
            "on-background": "#191c1d",
            "outline": "#906f6e",
            "outline-variant": "#e5bdbb",
            "error": "#ba1a1a",
            "error-container": "#ffdad6"
          },
          fontFamily: {
            sans: ['"Hanken Grotesk"', 'sans-serif'],
            display: ['"Hanken Grotesk"', 'sans-serif']
          },
          borderRadius: {
            DEFAULT: "0.25rem",
            sm: "0.125rem",
            md: "0.375rem",
            lg: "0.5rem",
            xl: "0.75rem",
            full: "9999px"
          }
        }
      }
    };
  </script>
  
  <link rel="stylesheet" href="/src/styles/main.css"/>
  
  <script>
    window.addEventListener('error', function(e) {
      document.body.innerHTML = '<div style="color:red; padding: 20px;"><strong>Error:</strong> ' + e.message + '<br><em>' + e.filename + ':' + e.lineno + '</em></div>';
    });
    window.addEventListener('unhandledrejection', function(e) {
      document.body.innerHTML = '<div style="color:red; padding: 20px;"><strong>Unhandled Promise Rejection:</strong> ' + e.reason + '</div>';
    });
  </script>
</head>
<body class="bg-background text-on-background font-sans antialiased min-h-screen flex flex-col selection:bg-primary-container selection:text-white">
  
  <!-- Navigation Header Mount Point -->
  <div id="navbar"></div>

  <!-- Main Dynamic View Container -->
  <main id="app" class="flex-grow"></main>

  <!-- Footer Mount Point -->
  <div id="footer"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
